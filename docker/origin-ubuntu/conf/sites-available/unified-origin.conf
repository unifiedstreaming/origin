AddHandler smooth-streaming.extensions .ism .isml

ServerName unified-origin

UspLicenseKey /etc/usp-license.key

<IfDefine LOG_FORMAT>
  LogFormat '${LOG_FORMAT}' log_format
</IfDefine>
<IfDefine !LOG_FORMAT>
  LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\" %D" log_format
</IfDefine>


<VirtualHost 0.0.0.0:80>
# Don't log kubernetes probes
  SetEnvIf User-Agent "kube-probe" dontlog
  CustomLog /dev/stdout log_format env=!dontlog
  ErrorLog /dev/stderr

  <IfDefine LOG_LEVEL>
    LogLevel ${LOG_LEVEL}
  </IfDefine>
  <IfDefine !LOG_LEVEL>
    LogLevel warn
  </IfDefine>

#   SSLProxyEngine on

  DocumentRoot /var/www/unified-origin

  Header set Access-Control-Allow-Headers "origin, range"
  Header set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
  Header set Access-Control-Allow-Origin "*"
  Header set Access-Control-Expose-Headers "Server,range"

  ################ Config for mod-wsgi #######################################
  # Keeping /manifest-edit in its own daemon process group to avoid deadlocks
  WSGIDaemonProcess manifest processes=2 threads=15 \
    python-path=/var/www/unified-origin/wsgi-scripts:/usr/libexec/usp-python-apps/manifest_edit

  # Should never be used directly, only via rewrite rules
  WSGIScriptAlias "/manifest-edit" "/var/www/unified-origin/wsgi-scripts/manifestedit.wsgi"

  # Pre-load script at daemon startup instead of on first request
  WSGIImportScript /var/www/unified-origin/wsgi-scripts/manifestedit.wsgi \
    process-group=manifest application-group=%{GLOBAL}

  # WSGIApplicationGroup %{GLOBAL} uses the global interpreter within the daemon
  # process, which is required to avoid deadlocks with C extensions.
  <Location /manifest-edit>
    WSGIProcessGroup manifest
    WSGIApplicationGroup %{GLOBAL}
  </Location>
  ############################################################################

  RewriteEngine On
  # QSA to preserve the query string
  # L flag for efficiency, stop processing other rules if one matches
  # pass the name of the query parameter name (e.g. "python_config") that 
  #  manifest_edit will need to read the config file name and then will have to
  #  remove from the upstream request path
  # pass the name of the virtual path associated to WSGIScriptAlias, so that
  #  can be removed from the upstream request path by manifest_edit 

  # When this request is about a DASH manifest (no remote storage)
  RewriteCond %{REQUEST_URI}  .*\.mpd$
  # AND When python_pipeline_config has a non-empty value
  RewriteCond %{QUERY_STRING} (^|&)python_config=([^&]+)
  RewriteRule "(.*)" \
    /manifest-edit$1 \
    [QSA,PT,L,E=pipeline:/etc/manifest-edit/conf/mpd/%2.yaml,E=config_param:python_config,E=proxy_path:/manifest-edit]

  # When this request is a DASH manifest (remote storage)
  RewriteCond %{REQUEST_URI}  .*\.ism[l]?$
  RewriteCond %{QUERY_STRING} (^|&)file=.*\.mpd($|&)
  # AND When python_pipeline_config has a non-empty value
  RewriteCond %{QUERY_STRING} (^|&)python_config=([^&]+)
  RewriteRule "(.*)" \
    /manifest-edit$1 \
    [QSA,PT,L,E=pipeline:/etc/manifest-edit/conf/mpd/%2.yaml,E=config_param:python_config,E=proxy_path:/manifest-edit]


  # When this request is about an HLS playlist (no remote storage)
  RewriteCond %{REQUEST_URI}  .*\.m3u8$
    # AND When python_pipeline_config has a non-empty value
  RewriteCond %{QUERY_STRING} (^|&)python_config=([^&]+)
  # handoff to WSGI app with a rewrite rule
  RewriteRule "(.*)" \
    /manifest-edit$1 \
    [QSA,PT,L,E=pipeline:/etc/manifest-edit/conf/m3u8_main/%2.yaml,E=config_param:python_config,E=proxy_path:/manifest-edit]

  # When this request is about an HLS playlist (remote storage)
  RewriteCond %{REQUEST_URI}  .*\.ism[l]?$
  RewriteCond %{QUERY_STRING} (^|&)file=.*\.m3u8($|&)
  # AND When python_pipeline_config has a non-empty value
  RewriteCond %{QUERY_STRING} (^|&)python_config=([^&]+)
  # handoff to WSGI app with a rewrite rule
  RewriteRule "(.*)" \
    /manifest-edit$1 \
    [QSA,PT,L,E=pipeline:/etc/manifest-edit/conf/m3u8_main/%2.yaml,E=config_param:python_config,E=proxy_path:/manifest-edit]

  ############################################################################

  # Enable Origin and use subrequests instead of libcurl
  <Location />
    UspHandleIsm on
    UspEnableSubreq on
  </Location>

  # Remote storage configuration
  <IfDefine REMOTE_STORAGE_URL>
    <Location "/${REMOTE_PATH}/">
      IsmProxyPass "${REMOTE_STORAGE_URL}"
    </Location>

    <Proxy "${REMOTE_STORAGE_URL}">
      ProxySet connectiontimeout=5 enablereuse=on keepalive=on retry=0 timeout=30 ttl=300
      RequestHeader unset Accept-Encoding
      RequestHeader unset x-amz-cf-id
      S3UseHeaders on
      <IfDefine S3_ACCESS_KEY>
        S3AccessKey ${S3_ACCESS_KEY}
      </IfDefine>
      <IfDefine S3_SECRET_KEY>
        S3SecretKey ${S3_SECRET_KEY}
      </IfDefine>
      <IfDefine S3_SECURITY_TOKEN>
        S3SecurityToken ${S3_SECURITY_TOKEN}
      </IfDefine>
      <IfDefine S3_REGION>
        S3Region ${S3_REGION}
      </IfDefine>
    </Proxy>
  </IfDefine>

</VirtualHost>

<Directory /var/www/unified-origin>
  Require all granted
  Options -Indexes
</Directory>

# Optional REST API for publishing point management
<IfDefine REST_API_PORT>
  Listen 0.0.0.0:${REST_API_PORT}
  <VirtualHost 0.0.0.0:${REST_API_PORT}>
    CustomLog /dev/stdout log_format
    ErrorLog /dev/stderr

    <IfDefine LOG_LEVEL>
      LogLevel ${LOG_LEVEL}
    </IfDefine>
    <IfDefine !LOG_LEVEL>
      LogLevel warn
    </IfDefine>

    DocumentRoot /var/www/unified-origin

    # Enable REST API
    <Location />
      UspHandleApi on
    </Location>
  </VirtualHost>
</IfDefine>
